document_type: passport
display_name: Passport
identifier_field: passport_number

fields:
  name:
    required: true
    type: string
  surname:
    required: false
    type: string
  passport_number:
    required: true
    type: identifier
    pattern: "^[A-Z0-9]{6,9}$"
  nationality:
    required: true
    type: country_code
  date_of_birth:
    required: true
    type: date
  date_of_issue:
    required: false
    type: date
  date_of_expiry:
    required: true
    type: date
  gender:
    required: true
    type: enum
    allowed: ["M", "F"]

cross_field_rules:
  - rule: date_before
    field_a: date_of_birth
    field_b: date_of_expiry
  - rule: not_future_date
    field: date_of_birth
  - rule: not_future_date
    field: date_of_issue

_disclaimer: "Prototype rules for demonstration only — NOT official government specifications"
