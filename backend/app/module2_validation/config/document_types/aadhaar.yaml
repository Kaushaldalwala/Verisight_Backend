document_type: aadhaar
display_name: Aadhaar Card
identifier_field: aadhaar_number

fields:
  name:
    required: false
    type: string
  aadhaar_number:
    required: true
    type: identifier
    pattern: "^\\d{12}$"
  date_of_birth:
    required: false
    type: date
  gender:
    required: false
    type: enum
    allowed: ["M", "F", "TRANSGENDER"]

cross_field_rules:
  - rule: not_future_date
    field: date_of_birth

_disclaimer: "Prototype rules for demonstration only — NOT official government specifications"
